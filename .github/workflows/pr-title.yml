# Reutilizável: o título do PR vira a mensagem do commit no squash merge, e o release-please
# ignora o que não segue Conventional Commits (CONTRIBUTING.md).
name: Título do PR (reutilizável)

on:
  workflow_call:

jobs:
  pr-title:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: "Confere o padrão <tipo>(<escopo>): <descrição>"
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|ci|build|chore|revert)(\([a-z0-9,-]+\))?!?: [^ ].*'
          if [[ ! $TITLE =~ $re ]]; then
            echo "::error title=Título fora do padrão::'$TITLE'. Use <tipo>(<escopo>): <descrição>, ex.: feat(lp): adiciona landing page de sorveteria. Padrão em https://github.com/YDEXCP/.github/blob/main/CONTRIBUTING.md"
            exit 1
          fi
          echo "Título ok: $TITLE"
